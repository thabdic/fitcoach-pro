<section>
  <h1 class="page-title">Users</h1>

  @if (loading()) {
    <div class="spinner-wrap"><p-progressSpinner strokeWidth="4" /></div>
  } @else if (users().length === 0) {
    <app-empty-state message="No users found." icon="pi pi-users" />
  } @else {
    <p-table [value]="users()" data-testid="users-table" [paginator]="users().length > 10" [rows]="10">
      <ng-template pTemplate="header">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-u>
        <tr>
          <td class="cell-title">{{ u.name }}</td>
          <td class="cell-sub">{{ u.email }}</td>
          <td><p-tag [value]="u.role | titlecase" severity="info" /></td>
          <td>
            <p-tag [value]="u.isActive ? 'Active' : 'Inactive'" [severity]="u.isActive ? 'success' : 'danger'" />
          </td>
          <td>
            <div class="row-actions">
              <p-button label="Role" icon="pi pi-id-card" size="small" [text]="true" (onClick)="openRole(u)" data-testid="change-role" />
              <p-button
                [label]="u.isActive ? 'Deactivate' : 'Activate'"
                [icon]="u.isActive ? 'pi pi-ban' : 'pi pi-check'"
                size="small"
                [text]="true"
                [severity]="u.isActive ? 'danger' : 'success'"
                (onClick)="toggleStatus(u)"
                data-testid="toggle-status"
              />
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</section>

<p-dialog header="Update Role" [(visible)]="showRoleValue" [modal]="true" [style]="{ width: '28rem' }">
  @if (selected(); as user) {
    <form [formGroup]="roleForm" (ngSubmit)="saveRole()" class="dialog-form">
      <div><span class="cell-sub">User</span><div class="cell-title">{{ user.name }}</div></div>
      <div class="field">
        <label for="role">Role</label>
        <p-select inputId="role" formControlName="role" [options]="roleOptions"
          optionLabel="label" optionValue="value" [fluid]="true" placeholder="Select role" />
      </div>
      <div class="row-actions">
        <p-button type="submit" label="Save role" icon="pi pi-check" [loading]="savingRole()" data-testid="save-role" />
        <p-button type="button" label="Cancel" severity="secondary" [text]="true" (onClick)="showRole.set(false)" />
      </div>
    </form>
  }
</p-dialog>
